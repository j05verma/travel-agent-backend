<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Travel Agent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            background: #f4f6f8;
            padding: 0 20px;
        }
        h1 { color: #1a73e8; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
        }
        button:hover { background: #1558b0; }
        .history { margin-top: 20px; }
        .msg-block { margin-bottom: 18px; }
        .you {
            color: #555;
            font-weight: bold;
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
        }
        .reply {
            white-space: pre-wrap;
            background: #eef3fc;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 8px;
            line-height: 1.5;
        }
        .timestamp { font-size: 12px; color: #999; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>✈️ AI Travel Agent</h1>
    <div class="card">
        <form method="post" th:action="@{/chat}">
            <textarea name="message" rows="3"
                      placeholder="e.g. Search flights from Bengaluru to Delhi, or Book AI-101 for Jayant"></textarea>
            <br>
            <button type="submit">Send</button>
        </form>
    </div>

    <div class="card history" th:if="${not #lists.isEmpty(history)}">
        <div class="msg-block" th:each="msg : ${history}">
            <div class="you">You: <span th:text="${msg.userMessage}"></span></div>
            <div class="reply" th:text="${msg.aiReply}"></div>
            <div class="timestamp" th:text="${#temporals.format(msg.timestamp, 'dd MMM yyyy, hh:mm a')}"></div>
        </div>
    </div>
</body>
</html>
